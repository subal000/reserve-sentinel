name: Exit-depth snapshot

# Runs the cross-lender study twice a day and commits the raw output as a
# dated folder. This is the actual moat: continuous history that can't be
# recreated after the fact. Missing a scheduled run doesn't break anything
# (workflow_dispatch covers a manual catch-up), but a long gap weakens the
# "we measure this continuously" claim, so failures alert on Telegram.
#
# Schedule (UTC): 05:30 (US markets closed) and 15:00 (US markets open) —
# see research/2026-09-16-cross-lender-exit/README.md for why both matter.
#
# Needs the same optional TELEGRAM_* secrets as score.yml for alerts.
# Needs no other secrets — this workflow only reads public data.

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: unwind-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run the study
        id: run
        working-directory: research/2026-09-16-cross-lender-exit
        run: |
          STAMP=$(date -u +%Y-%m-%dT%H%M)Z
          DIR="snapshots/${STAMP}"
          mkdir -p "$DIR"
          python3 collateral.py "$DIR"
          python3 sellable.py "$DIR" | tee "$DIR/summary.txt"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

      - name: Write snapshot README
        working-directory: research/2026-09-16-cross-lender-exit
        run: python3 ../../.github/scripts/write_snapshot_readme.py "${{ steps.run.outputs.dir }}"

      - name: Update latest.json
        working-directory: research/2026-09-16-cross-lender-exit
        run: python3 ../../.github/scripts/update_latest.py "${{ steps.run.outputs.dir }}"

      - name: Commit and push
        run: |
          git config user.name "unwind-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/2026-09-16-cross-lender-exit/snapshots \
                  research/2026-09-16-cross-lender-exit/latest.json
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "snapshot: exit-depth run ${{ steps.run.outputs.stamp }} [skip ci]"
          git push

      - name: Alert on failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="🔻 Unwind snapshot run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
