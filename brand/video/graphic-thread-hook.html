<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unwind — thread hook graphic</title>
<!--
  Static 1600x900 tweet card for tweet 1 (the opening hook) of the Friday
  explainer thread. Deliberately text-only, no numbers — graphic-thread-
  finding.html (tweet 5) carries the data. Same fonts/pipeline.
-->
<style>
  @font-face { font-family: "Instrument Sans"; src: url("__INST_FONT__") format("woff2"); font-weight: 600; font-display: block; }
  @font-face { font-family: "JetBrains Mono"; src: url("__MONO_FONT__") format("woff2"); font-weight: 600; font-display: block; }

  :root {
    --ink: #EBEEF2;
    --teal: #28C2AB;
    --bg: #0D1119;
    --dim: #7D8799;
    --line: #1F2735;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1600px; height: 900px; background: var(--bg); overflow: hidden; }
  body {
    font-family: "Instrument Sans", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(1000px 600px at 50% 8%, rgba(40,194,171,.14), transparent 70%),
      linear-gradient(to right, rgba(235,238,242,.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(235,238,242,.03) 1px, transparent 1px);
    background-size: auto, 64px 64px, 64px 64px;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

  #frame {
    position: relative; width: 1600px; height: 900px; padding: 72px 96px;
    display: flex; flex-direction: column;
  }

  .brand { display: flex; align-items: center; gap: 12px; }
  .brand span { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }

  #tag {
    margin-top: 56px; display: inline-flex; align-self: flex-start; align-items: center; gap: 10px;
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line);
    font-size: 20px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
  }
  #tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }

  #stack { margin-top: auto; margin-bottom: auto; }
  .line { font-size: 68px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.22; max-width: 1250px; }
  .line.dim { color: var(--dim); }
  .line.teal { color: var(--teal); }

  #foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 20px; color: var(--dim); }
</style>
</head>
<body>
<div id="frame">
  <div class="brand">
    <svg width="30" height="17" viewBox="12 14 52 28" fill="none">
      <defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="21" y1="0" x2="61" y2="0">
        <stop offset="0" stop-color="#EBEEF2"/><stop offset=".22" stop-color="#28C2AB"/><stop offset="1" stop-color="#28C2AB" stop-opacity=".1"/>
      </linearGradient></defs>
      <path d="M21 33 H58" stroke="url(#g)" stroke-width="4.6" stroke-linecap="round"/>
      <path d="M30 24 A9 9 0 1 0 21 33" stroke="#EBEEF2" stroke-width="4.6" stroke-linecap="round"/>
    </svg>
    <span>Unwind</span>
  </div>

  <div id="tag"><span class="dot"></span>A thread</div>

  <div id="stack">
    <p class="line" style="margin:0">Crypto lenders already check whether collateral can be sold.</p>
    <p class="line teal" style="margin:22px 0 0">Tokenized stocks break that check.</p>
  </div>

  <div id="foot">
    <span>Why, and what I'm building</span>
    <span class="mono">@0xsubal</span>
  </div>
</div>
</body>
</html>
